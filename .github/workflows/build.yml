name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish -c Release -o out

      - name: Hash
        shell: pwsh
        run: |
          $h = (Get-FileHash out/modhash.exe -Algorithm SHA256).Hash.ToLower()
          "$h  modhash.exe" | Out-File out/modhash.exe.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: ModHashVerifier
          path: |
            out/modhash.exe
            out/modhash.exe.sha256

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            out/modhash.exe
            out/modhash.exe.sha256
