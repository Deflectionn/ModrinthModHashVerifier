name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish CLI
        run: dotnet publish ModHashVerifier.csproj -c Release -o out

      - name: Publish GUI
        run: dotnet publish Gui/ModHashGui.csproj -c Release -o out-gui

      - name: Hash
        shell: pwsh
        run: |
          foreach ($f in 'out/modhash.exe', 'out-gui/modhash-gui.exe') {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)" | Out-File "$f.sha256" -Encoding ascii
          }

      - uses: actions/upload-artifact@v4
        with:
          name: modhash
          path: |
            out/modhash.exe
            out/modhash.exe.sha256
            out-gui/modhash-gui.exe
            out-gui/modhash-gui.exe.sha256

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            out/modhash.exe
            out/modhash.exe.sha256
            out-gui/modhash-gui.exe
            out-gui/modhash-gui.exe.sha256
